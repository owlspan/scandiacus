name: release

# A release happens when the version in compiler/veyl.go has none yet:
# on a push to veyl that bumps it, or on pushing its tag by hand. Every
# other push stops after the first step.
on:
  push:
    branches: [veyl]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: veyl

      - name: Is this version released yet
        id: version
        working-directory: veyl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([regex]'const Version = "([^"]+)"').Match((Get-Content asm-src\compiler\veyl.go -Raw)).Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "the tag says ${{ github.ref_name }} and compiler/veyl.go says $v"
          }
          gh release view "v$v" --repo "${{ github.repository }}" 2>&1 | Out-Null
          $new = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, needs a release: $new"
          exit 0

      - uses: actions/setup-go@v5
        if: steps.version.outputs.new == 'true'
        with:
          go-version: '1.24'
          cache: false

      - name: Test
        if: steps.version.outputs.new == 'true'
        working-directory: veyl/asm-src
        run: |
          go test ../frontend/...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        if: steps.version.outputs.new == 'true'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        if: steps.version.outputs.new == 'true'
        working-directory: veyl/asm-src
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Build the Linux and macOS binaries
        if: steps.version.outputs.new == 'true'
        working-directory: veyl/asm-src
        env:
          CGO_ENABLED: '0'
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $env:GOOS = 'linux';  $env:GOARCH = 'amd64'
          go build -trimpath -o "dist\veyl-$v-linux-x86_64" ./compiler
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:GOOS = 'darwin'; $env:GOARCH = 'amd64'
          go build -trimpath -o "dist\veyl-$v-macos-x86_64" ./compiler
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Release notes
        if: steps.version.outputs.new == 'true'
        working-directory: veyl
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $v" }
          Set-Content -Path notes.md -Value $m.Groups[1].Value.Trim() -Encoding utf8

      - name: Publish
        if: steps.version.outputs.new == 'true'
        working-directory: veyl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" `
            "asm-src\dist\veyl-$v-setup.exe" `
            "asm-src\dist\veyl-$v-linux-x86_64" `
            "asm-src\dist\veyl-$v-macos-x86_64" `
            --target "${{ github.sha }}" --title "Veyl $v" --notes-file notes.md
